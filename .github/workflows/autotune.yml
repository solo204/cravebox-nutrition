name: NutritionParser Autotune

on:
  schedule:
    - cron: '0 14 * * *'  # daily 2:00 PM UTC

  workflow_dispatch:
    inputs:
      max_per_site:
        description: 'Max recipes per site (default: 200)'
        required: false
        default: '200'
      sites:
        description: 'Extra site URLs to crawl (comma-separated)'
        required: false
        default: ''
      urls:
        description: 'Specific recipe URLs to scrape (comma-separated)'
        required: false
        default: ''
      use_recipenlg:
        description: 'Download RecipeNLG from HuggingFace and use as dataset (skips live crawl)'
        required: false
        default: 'false'
      dataset:
        description: 'Path to local dataset file relative to repo root (leave blank when use_recipenlg=true)'
        required: false
        default: ''
      max_dataset_rows:
        description: 'Max rows to read from dataset (default: 1600000 for RecipeNLG Gathered)'
        required: false
        default: '500000'
      skip_crawl:
        description: 'Skip crawl step (reuse last crawled_ingredients.json)'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run — do not commit changes'
        required: false
        default: 'false'

jobs:
  autotune:
    name: Run Autotune Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout cravebox-nutrition
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: autotune/requirements.txt

      - name: Install dependencies
        run: pip install -r autotune/requirements.txt

      - name: Download RecipeNLG from HuggingFace
        if: github.event.inputs.use_recipenlg == 'true'
        run: |
          pip install datasets pyarrow pandas -q
          python autotune/download_recipenlg.py
          echo "RECIPENLG_PATH=autotune/data/recipenlg_gathered.parquet" >> "$GITHUB_ENV"
          echo "RECIPENLG_ROWS=1600000" >> "$GITHUB_ENV"

      - name: Check USDA data files
        run: |
          if [ -f autotune/data/food_nutrient.csv ]; then
            echo "USDA data files present (uploaded to repo or cached)"
          else
            echo "WARNING: autotune/data/ is missing USDA CSVs."
            echo "Upload usda_sr_legacy.csv, food_nutrient.csv, nutrient.csv via git-lfs or manually."
            echo "Enricher will fall back to USDA FDC API only."
          fi

      - name: Run autotune pipeline
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          ARGS="--max-per-site ${{ github.event.inputs.max_per_site || '200' }} --max-gaps 2000"
          [ "${{ github.event.inputs.skip_crawl }}" = "true" ] && ARGS="$ARGS --skip-crawl"
          [ "${{ github.event.inputs.dry_run }}"   = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.sites }}"  ] && ARGS="$ARGS --sites '${{ github.event.inputs.sites }}'"
          [ -n "${{ github.event.inputs.urls }}"   ] && ARGS="$ARGS --urls '${{ github.event.inputs.urls }}'"
          # RecipeNLG (downloaded above) takes precedence over manual dataset input
          if [ -n "${RECIPENLG_PATH}" ]; then
            ARGS="$ARGS --dataset ${RECIPENLG_PATH} --max-dataset-rows ${RECIPENLG_ROWS} --no-sites"
          elif [ -n "${{ github.event.inputs.dataset }}" ]; then
            ARGS="$ARGS --dataset ${{ github.event.inputs.dataset }} --max-dataset-rows ${{ github.event.inputs.max_dataset_rows || '500000' }}"
          fi
          python autotune/autotune.py $ARGS

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and open PR for review
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "CraveBox Autotune Bot"
          git config user.email "autotune@cravebox.app"
          VERSION=$(python -c "import json; d=json.load(open('data/nutrition_version.json')); print(d['version'])")
          ENTRIES=$(python -c "import json; d=json.load(open('data/nutrition_db.json')); print(len(d))")
          BRANCH="autotune/v${VERSION}"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "autotune: v${VERSION} — ${ENTRIES} DB entries [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "autotune: v${VERSION} — ${ENTRIES} DB entries" \
            --body "$(python autotune/print_summary.py 2>&1 || echo 'See run artifacts for details.')" \
            --base main \
            --head "$BRANCH" \
            --label "autotune" || echo "PR already exists or label missing — branch pushed, create PR manually."

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotune-run-${{ github.run_number }}
          path: |
            autotune/autotune_summary.json
            autotune/parse_report.json
            autotune/proposals.json
          retention-days: 30

      - name: Print summary
        if: always()
        run: python autotune/print_summary.py
