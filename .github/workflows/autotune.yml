name: NutritionParser Autotune

on:
  schedule:
    - cron: '0 2 * * *'   # daily 2:00 AM UTC

  workflow_dispatch:
    inputs:
      max_per_site:
        description: 'Max recipes per site (default: 200)'
        required: false
        default: '200'
      sites:
        description: 'Extra site URLs to crawl (comma-separated)'
        required: false
        default: ''
      urls:
        description: 'Specific recipe URLs to scrape (comma-separated)'
        required: false
        default: ''
      skip_crawl:
        description: 'Skip crawl step (reuse last crawled_ingredients.json)'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run — do not commit changes'
        required: false
        default: 'false'

jobs:
  autotune:
    name: Run Autotune Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout cravebox-nutrition
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: autotune/requirements.txt

      - name: Install dependencies
        run: pip install -r autotune/requirements.txt

      - name: Cache USDA data files (30 days)
        uses: actions/cache@v4
        with:
          path: autotune/data/
          key: usda-data-${{ hashFiles('autotune/data/.usda_cache_key') }}

      - name: Fetch USDA SR Legacy CSVs if not cached
        run: |
          if [ ! -f autotune/data/food_nutrient.csv ]; then
            echo "Downloading USDA FoodData Central SR Legacy ..."
            mkdir -p autotune/data
            curl -L "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2019-04.zip" \
                 -o /tmp/usda_sr.zip --max-time 180
            unzip -j /tmp/usda_sr.zip "*.csv" -d autotune/data/
            mv autotune/data/food.csv autotune/data/usda_sr_legacy.csv 2>/dev/null || true
            date +%Y-%m > autotune/data/.usda_cache_key
            echo "USDA data ready"
          else
            echo "USDA data already cached"
          fi

      - name: Run autotune pipeline
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          ARGS="--max-per-site ${{ github.event.inputs.max_per_site || '200' }} --max-gaps 2000"
          [ "${{ github.event.inputs.skip_crawl }}" = "true" ] && ARGS="$ARGS --skip-crawl"
          [ "${{ github.event.inputs.dry_run }}"   = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.sites }}"  ] && ARGS="$ARGS --sites '${{ github.event.inputs.sites }}'"
          [ -n "${{ github.event.inputs.urls }}"   ] && ARGS="$ARGS --urls '${{ github.event.inputs.urls }}'"
          python autotune/autotune.py $ARGS

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data files
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "CraveBox Autotune Bot"
          git config user.email "autotune@cravebox.app"
          VERSION=$(python -c "import json; d=json.load(open('data/nutrition_version.json')); print(d['version'])")
          ENTRIES=$(python -c "import json; d=json.load(open('data/nutrition_db.json')); print(len(d))")
          git add data/
          git commit -m "autotune: v${VERSION} — ${ENTRIES} DB entries [skip ci]"
          git push

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotune-run-${{ github.run_number }}
          path: |
            autotune/autotune_summary.json
            autotune/parse_report.json
            autotune/proposals.json
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          [ -f autotune/autotune_summary.json ] && python -c "
import json
d  = json.load(open('autotune/autotune_summary.json'))
pr = d.get('parse_report', {})
ap = d.get('apply', {})
v  = d.get('version', {})
print(f'Crawled:       {d.get(\"crawled_ingredients\", \"?\"):,}')
print(f'Parse OK:      {pr.get(\"ok\", \"?\")}  ({pr.get(\"ok_pct\", \"?\")}%)')
print(f'UNKNOWN gaps:  {pr.get(\"unknown\", \"?\")}')
print(f'New entries:   {ap.get(\"new_entries_applied\", \"?\")}')
print(f'New synonyms:  {ap.get(\"new_synonyms_applied\", \"?\")}')
print(f'DB version:    {v.get(\"version\", \"?\")}  ({v.get(\"entry_count\", \"?\")} entries)')
print(f'Elapsed:       {d.get(\"elapsed_seconds\", \"?\")}s')
"
